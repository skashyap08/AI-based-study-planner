<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Study Planner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="page-wrapper">

    <!-- Navbar -->
    <nav class="navbar">
        <h2>📚 Study Planner</h2>
        <span class="tag">AI Powered</span>
    </nav>

    <div class="app-container">

        <!-- Header -->
        <header class="header">
            <h1>Smart Study Dashboard</h1>
            <p>Don't just study — strategize.</p>
        </header>

        <!-- Main Grid -->
        <div class="main-grid">

            <!-- Add Task -->
            <section class="card">
                <h2>➕ Add New Task</h2>

                <div class="form">
                    <label>Subject</label>
                    <input id="subject" placeholder="e.g. Data Structures">

                    <label>Topic</label>
                    <input id="topic" placeholder="e.g. Trees">

                    <label>Difficulty</label>
                    <input id="difficulty" type="number" min="1" max="5">

                    <label>Deadline</label>
                    <input id="deadline" type="date">

                    <button onclick="addTask()">Add Task</button>
                </div>
            </section>

            <!-- Schedule -->
            <section class="card">
                <h2>🧠 AI Schedule</h2>

                <button onclick="getSchedule()">Generate Plan</button>

                <ul id="taskList"></ul>
            </section>

        </div>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
